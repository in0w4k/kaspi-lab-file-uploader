spring:
  application:
    name: final-project-1
  data:
    mongodb:
      auto-index-creation: true
      uri: mongodb://mongodb:27017/file_db

s3:
  endpoint: ${S3_ENDPOINT:http://localhost:9000}
  bucket: uploads
  access-key: ${S3_ACCESS_KEY:admin}
  secret-key: ${S3_SECRET_KEY:password}
  region: us-east-1